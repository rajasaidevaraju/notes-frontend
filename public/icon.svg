<svg width="340" height="440" viewBox="230 80 340 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1F14" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B7E8AC"/>
      <stop offset="100%" stop-color="#9AD98E"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Document -->
    <rect x="250" y="100" width="300" height="400" rx="28"
          fill="url(#paperGradient)" stroke="#153723" stroke-width="0"
          filter="url(#softShadow)"/>

    <!-- Text lines -->
    <rect x="285" y="165" width="230" height="16" rx="8" fill="#153723"/>
    <rect x="285" y="220" width="210" height="16" rx="8" fill="#153723"/>
    <rect x="285" y="275" width="210" height="16" rx="8" fill="#153723"/>
    <rect x="285" y="330" width="150" height="16" rx="8" fill="#153723"/>
    <rect x="285" y="385" width="105" height="16" rx="8" fill="#153723"/>
    <rect x="285" y="440" width="60"  height="16" rx="8" fill="#153723"/>
  </g>
</svg>
